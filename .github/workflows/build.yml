name: tests and AppImage

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # only needed to attach the AppImage to a release (tags)

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag must match the version in the code and have a changelog entry (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(sed -n 's/^__version__ *= *"\(.*\)"/\1/p' filmdeck/__init__.py)"
          if [ "$tag" != "$code" ]; then
            echo "::error::tag v$tag, but filmdeck/__init__.py says $code. Fix the version, delete the tag, tag again."
            exit 1
          fi
          bash packaging/release-notes.sh "$tag" > /dev/null

      - name: System libraries (Qt offscreen, libusb)
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0 libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Get the current scanner driver (the contract tests read its source)
        run: git clone --depth 1 https://github.com/cgillinger/opticfilm135i-linux "$RUNNER_TEMP/driver"

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
          OF135I_SRC="$RUNNER_TEMP/driver" python -m pytest -q

      - name: Build the AppImage (runs its selftest at the end)
        run: bash packaging/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: FilmDeck-AppImage
          path: packaging/build/FilmDeck-*-x86_64.AppImage
          if-no-files-found: error

      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash packaging/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          app=(packaging/build/FilmDeck-*-x86_64.AppImage)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # the release was already made by hand on github.com: add the AppImage and use the changelog text
            gh release upload "$GITHUB_REF_NAME" "${app[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "FilmDeck $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" "${app[@]}" \
              --title "FilmDeck $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
